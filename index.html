<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>벽돌깨기</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #1e1e2f, #2b2b45);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    color: #fff;
    touch-action: none;
    overflow: hidden;
  }
  #gameWrap {
    position: relative;
  }
  canvas {
    background: #0f0f1a;
    border: 3px solid #4b4bff;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(75,75,255,0.5);
    display: block;
    touch-action: none;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 480px;
    margin-bottom: 8px;
    font-size: 18px;
    font-weight: bold;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.6);
    border-radius: 8px;
    text-align: center;
    padding: 20px;
  }
  #overlay h1 {
    margin-bottom: 10px;
    font-size: 28px;
  }
  #overlay p {
    margin-bottom: 16px;
    font-size: 15px;
    color: #ccc;
  }
  button {
    background: #4b4bff;
    color: #fff;
    border: none;
    padding: 10px 22px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #6a6aff; }
  #hint {
    margin-top: 10px;
    font-size: 13px;
    color: #999;
  }
</style>
</head>
<body>

<div id="hud">
  <div>점수: <span id="score">0</span></div>
  <div>목숨: <span id="lives">3</span></div>
</div>

<div id="gameWrap">
  <canvas id="game" width="480" height="600"></canvas>
  <div id="overlay">
    <h1>벽돌깨기</h1>
    <p>마우스를 움직여 막대를 조작하고<br>클릭(또는 터치)해서 공을 발사하세요.</p>
    <button id="startBtn">게임 시작</button>
  </div>
</div>
<div id="hint">클릭/터치로 위치 이동 · 클릭해서 공 발사</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');

const W = canvas.width, H = canvas.height;

// --- 게임 상태 ---
let score = 0;
let lives = 3;
let running = false;
let ballLaunched = false;

// --- 패들 ---
const paddle = {
  w: 90,
  h: 14,
  x: W / 2 - 45,
  y: H - 30
};

// --- 공 ---
const ball = {
  r: 8,
  x: W / 2,
  y: paddle.y - 10,
  dx: 0,
  dy: 0,
  speed: 5
};

// --- 벽돌 ---
const brick = {
  rows: 6,
  cols: 8,
  w: 48,
  h: 18,
  padding: 6,
  offsetTop: 50,
  offsetLeft: 12
};
let bricks = [];

const colors = ['#ff4b6e', '#ff9f4b', '#ffe14b', '#4bff88', '#4bd0ff', '#a04bff'];

function createBricks() {
  bricks = [];
  for (let r = 0; r < brick.rows; r++) {
    bricks[r] = [];
    for (let c = 0; c < brick.cols; c++) {
      bricks[r][c] = { x: 0, y: 0, alive: true };
    }
  }
}
createBricks();

function resetBall() {
  ball.x = paddle.x + paddle.w / 2;
  ball.y = paddle.y - ball.r - 2;
  ball.dx = 0;
  ball.dy = 0;
  ballLaunched = false;
}

function launchBall() {
  if (ballLaunched || !running) return;
  const angle = (Math.random() * 0.6 + 0.2) * Math.PI; // 20% ~ 80% of PI, upward-ish
  ball.dx = ball.speed * Math.cos(angle) * (Math.random() < 0.5 ? -1 : 1);
  ball.dy = -ball.speed;
  ballLaunched = true;
}

// --- 입력 처리: 마우스/터치 위치로 패들 이동, 클릭/터치로 발사 ---
function movePaddleTo(clientX) {
  const rect = canvas.getBoundingClientRect();
  const scale = W / rect.width;
  let x = (clientX - rect.left) * scale - paddle.w / 2;
  x = Math.max(0, Math.min(W - paddle.w, x));
  paddle.x = x;
  if (!ballLaunched) {
    ball.x = paddle.x + paddle.w / 2;
  }
}

canvas.addEventListener('mousemove', (e) => {
  movePaddleTo(e.clientX);
});

canvas.addEventListener('click', (e) => {
  movePaddleTo(e.clientX);
  if (!running) return;
  launchBall();
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  movePaddleTo(t.clientX);
  if (running) launchBall();
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  movePaddleTo(t.clientX);
}, { passive: false });

// --- 그리기 ---
function drawPaddle() {
  ctx.fillStyle = '#4b4bff';
  ctx.shadowColor = '#4b4bff';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawBall() {
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 10;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.closePath();
}

function drawBricks() {
  for (let r = 0; r < brick.rows; r++) {
    for (let c = 0; c < brick.cols; c++) {
      const b = bricks[r][c];
      if (!b.alive) continue;
      const bx = c * (brick.w + brick.padding) + brick.offsetLeft;
      const by = r * (brick.h + brick.padding) + brick.offsetTop;
      b.x = bx;
      b.y = by;
      ctx.fillStyle = colors[r % colors.length];
      ctx.beginPath();
      ctx.roundRect(bx, by, brick.w, brick.h, 4);
      ctx.fill();
    }
  }
}

// --- 충돌 처리 ---
function collideBricks() {
  for (let r = 0; r < brick.rows; r++) {
    for (let c = 0; c < brick.cols; c++) {
      const b = bricks[r][c];
      if (!b.alive) continue;
      if (
        ball.x + ball.r > b.x &&
        ball.x - ball.r < b.x + brick.w &&
        ball.y + ball.r > b.y &&
        ball.y - ball.r < b.y + brick.h
      ) {
        b.alive = false;
        ball.dy *= -1;
        score += 10;
        scoreEl.textContent = score;
        checkWin();
        return;
      }
    }
  }
}

function checkWin() {
  const remaining = bricks.flat().some(b => b.alive);
  if (!remaining) {
    endGame(true);
  }
}

function update() {
  if (!ballLaunched) return;

  ball.x += ball.dx;
  ball.y += ball.dy;

  // 좌우 벽
  if (ball.x - ball.r < 0) {
    ball.x = ball.r;
    ball.dx *= -1;
  } else if (ball.x + ball.r > W) {
    ball.x = W - ball.r;
    ball.dx *= -1;
  }

  // 위쪽 벽
  if (ball.y - ball.r < 0) {
    ball.y = ball.r;
    ball.dy *= -1;
  }

  // 패들 충돌
  if (
    ball.y + ball.r > paddle.y &&
    ball.y + ball.r < paddle.y + paddle.h + ball.speed &&
    ball.x > paddle.x &&
    ball.x < paddle.x + paddle.w &&
    ball.dy > 0
  ) {
    const hitPos = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1 ~ 1
    const angle = hitPos * (Math.PI / 3); // 최대 60도
    const speed = Math.hypot(ball.dx, ball.dy);
    ball.dx = speed * Math.sin(angle);
    ball.dy = -Math.abs(speed * Math.cos(angle));
    ball.y = paddle.y - ball.r;
  }

  // 바닥으로 떨어짐
  if (ball.y - ball.r > H) {
    lives--;
    livesEl.textContent = lives;
    if (lives <= 0) {
      endGame(false);
    } else {
      resetBall();
    }
  }

  collideBricks();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBricks();
  drawPaddle();
  drawBall();
}

function loop() {
  if (running) {
    update();
    draw();
  }
  requestAnimationFrame(loop);
}

function startGame() {
  score = 0;
  lives = 3;
  scoreEl.textContent = score;
  livesEl.textContent = lives;
  createBricks();
  resetBall();
  running = true;
  overlay.style.display = 'none';
}

function endGame(won) {
  running = false;
  overlay.style.display = 'flex';
  overlay.querySelector('h1').textContent = won ? '🎉 클리어!' : '게임 오버';
  overlay.querySelector('p').innerHTML = won
    ? `모든 벽돌을 깼습니다!<br>최종 점수: ${score}`
    : `최종 점수: ${score}<br>다시 도전해보세요.`;
  startBtn.textContent = '다시 시작';
}

startBtn.addEventListener('click', startGame);

draw(); // 초기 화면(대기 상태) 렌더
loop();
</script>
</body>
</html>
